params:
  - name: escaped
    type: string
    default: 'p\$INSERTED'
  - name: variable
    type: string
    default: '$INSERTED/data'
env:
  INSERTED: expanded
working_dir: .
steps:
  - id: check
    env:
      COPY: ${params.variable}
    action: file.write
    with:
      path: insertion.txt
      content: |
        ${params.escaped}
        ${params.variable}
        ${env.COPY}
        $INSERTED
